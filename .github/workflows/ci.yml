# REGISTRO DE IA · NO ES FUENTE
# Generado por: Claude (subagente) · 31-oct-2026, construcción completa de TX-1
# Estado de revisión: SIN REVISAR
# Manda por encima: IA_TECNOLOGIAS-vigentes.md · la palabra de Juan
#
# Integración continua de FlorLogic (TEC-30, GitHub Actions). En cada empuje o PR a codigo-desarrollo:
#   1. construir-y-probar: Temurin 27, «./mvnw verify» con Docker (Testcontainers y las pruebas de punta a punta
#      corren en los ejecutores Ubuntu de GitHub), informe de cobertura JaCoCo (TEC-38) como artefacto y, si el
#      repositorio tiene el secreto SONAR_TOKEN, el análisis de SonarQube / SonarQube Cloud (TEC-39).
#      Después, Trivy (TEC-40) sobre el código y las dependencias: informe HIGH y CRITICAL como artefacto, y falla si
#      hay alguna CRITICAL con arreglo.
#   2. imagen: construye la imagen del backend (backend-finca/Dockerfile) y la escanea con Trivy; no la publica
#      (todavía no hay registro de imágenes decidido).
# Integridad (OWASP A08): cada acción va fijada por el SHA completo de su commit, con la versión en el comentario.
# Ningún secreto en este archivo: SONAR_TOKEN es un secreto del repositorio; SONAR_HOST_URL y SONAR_ORGANIZATION,
# variables del repositorio.
name: CI

on:
  push:
    branches: [codigo-desarrollo]
  pull_request:
    branches: [codigo-desarrollo]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: v0.76.1

defaults:
  run:
    working-directory: codigo

jobs:
  construir-y-probar:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0            # Sonar necesita la historia para atribuir el código nuevo

      - name: JDK Temurin 27 (TEC-01) con caché de Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "27"
          cache: maven
          cache-dependency-path: codigo/**/pom.xml

      - name: Construir y probar (./mvnw verify, con Docker)
        run: ./mvnw -B -ntp verify

      - name: Informe de cobertura JaCoCo
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cobertura-jacoco
          path: codigo/*/target/site/jacoco/
          if-no-files-found: warn

      - name: Informes de pruebas (Surefire)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: informes-de-pruebas
          path: codigo/*/target/surefire-reports/

      # Trivy después de verify: lee las dependencias del ~/.m2 ya lleno y los .jar de target/, sin pedirle a Maven
      # Central cada pom.xml (que responde 429 si se le pide demasiado).
      - name: Trivy · informe completo HIGH y CRITICAL (no falla)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: codigo
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          format: table
          output: trivy-codigo.txt
          exit-code: "0"

      - name: Guardar el informe de Trivy
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-codigo
          path: trivy-codigo.txt

      - name: Trivy · falla con una CRITICAL que tiene arreglo
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: codigo
          scanners: vuln,secret
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Análisis de SonarQube (solo si existe el secreto SONAR_TOKEN)
        if: env.SONAR_TOKEN != ''
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL || 'https://sonarcloud.io' }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: >-
          ./mvnw -B -ntp sonar:sonar
          -Dsonar.host.url="$SONAR_HOST_URL"
          ${SONAR_ORGANIZATION:+-Dsonar.organization=$SONAR_ORGANIZATION}
          -Dsonar.qualitygate.wait=true

  imagen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: construir-y-probar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Construir la imagen del backend (sin publicarla)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: codigo
          file: codigo/backend-finca/Dockerfile
          tags: florlogic/backend-finca:${{ github.sha }}
          load: true
          push: false

      - name: Trivy · imagen del backend (falla con una CRITICAL que tiene arreglo)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: image
          image-ref: florlogic/backend-finca:${{ github.sha }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

# ── Guía de lectura · IA (Claude), 3-nov-2026, a pedido de Juan · SIN REVISAR ──
# Propósito: la integración continua en GitHub Actions: construye y prueba, guarda cobertura e informes, escanea con
# Trivy, analiza con SonarQube si hay token, y construye y escanea la imagen del backend.
# Uso: GitHub lo ejecuta solo en cada push o pull request a codigo-desarrollo, o a mano desde la pestaña Actions
# (workflow_dispatch). Nadie lo corre en local.
# Origen: la cabecera de arriba (TEC-30 Actions, TEC-38 JaCoCo, TEC-39 SonarQube, TEC-40 Trivy; OWASP A08 es
# integridad del software).
# Línea por línea (lo no obvio):
# - on: push / pull_request con branches: los eventos y la rama que disparan el flujo. workflow_dispatch: botón manual.
# - permissions: contents: read: el token automático del flujo solo puede leer el repositorio.
# - concurrency group ci-(rama) + cancel-in-progress: true: un empuje nuevo a la misma rama cancela la corrida vieja.
# - Las expresiones con doble llave y signo de pesos se evalúan en GitHub: github.ref (la rama), github.sha (el
#   commit), secrets.X (secretos del repo), vars.X (variables del repo), env.X (variables del flujo).
# - defaults.run.working-directory: codigo: todo paso run: corre dentro de codigo/ (los uses: no se afectan; por eso
#   sus rutas empiezan con codigo/).
# - runs-on: ubuntu-24.04: la máquina virtual de GitHub (trae Docker, así Testcontainers sí corre aquí).
#   timeout-minutes: tope antes de cancelar.
# - uses: dueño/acción@SHA # vX: acción de terceros fijada por el SHA de su commit; la etiqueta del comentario solo
#   informa. Una etiqueta movida no cambia lo que se ejecuta.
# - actions/checkout con fetch-depth: 0: baja toda la historia, no solo el último commit.
# - actions/setup-java con cache: maven y cache-dependency-path: instala Temurin 27 y guarda el ~/.m2 entre
#   corridas, con una llave que cambia si cambia algún pom.xml.
# - ./mvnw -B -ntp verify: -B modo por lotes, -ntp sin el progreso de cada descarga; verify compila y corre pruebas.
# - if: always() / if: failure(): el paso corre siempre, o solo si algo anterior falló.
# - actions/upload-artifact con path e if-no-files-found: warn: guarda archivos descargables de la corrida; si no
#   hay, solo avisa.
# - aquasecurity/trivy-action: scan-type fs (carpeta) o image; scanners qué buscar; severity qué niveles;
#   ignore-unfixed: true omite lo que aún no tiene arreglo; exit-code "0" nunca falla, "1" falla si encuentra algo.
# - if: env.SONAR_TOKEN != '': el análisis solo corre si el repositorio tiene ese secreto.
# - vars.SONAR_HOST_URL || 'https://sonarcloud.io': usa la variable o, si no existe, SonarQube Cloud.
# - run: >- …: bloque YAML plegado; las líneas se unen con espacios en una sola orden. La expansión de shell
#   «SONAR_ORGANIZATION:+…» agrega -Dsonar.organization solo si la variable tiene valor.
#   -Dsonar.qualitygate.wait=true: espera el veredicto de la puerta de calidad y falla si no pasa.
# - needs: construir-y-probar: el trabajo imagen solo empieza si el anterior terminó bien.
# - docker/setup-buildx-action: activa BuildKit (lo pide RUN --mount del Dockerfile).
# - docker/build-push-action con load: true y push: false: construye y deja la imagen en el Docker local para Trivy,
#   sin subirla a ningún registro.
