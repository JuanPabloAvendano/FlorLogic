wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.zip
distributionSha256Sum=5af3b743dd8b876b5c45da33b676251e5f1687712644abb4ee519ca56e1d89ce

# ── Guía de lectura · IA (Claude), 3-nov-2026, a pedido de Juan · SIN REVISAR ──
# Propósito: dice a mvnw y mvnw.cmd qué Maven bajar y usar, para que todos construyan con la misma versión sin
# instalar Maven.
# Uso: lo leen codigo/mvnw (Linux y macOS) y codigo/mvnw.cmd (Windows) en cada ejecución; el Dockerfile del backend
# también lo copia.
# Origen: lo genera el plugin Maven Wrapper (mvn wrapper:wrapper); la versión de Maven se cambia aquí.
# Línea por línea (lo no obvio):
# - wrapperVersion=3.3.4: la versión del Maven Wrapper que generó los scripts.
# - distributionType=only-script: sin maven-wrapper.jar; los scripts bajan y descomprimen Maven por sí solos.
# - distributionUrl: el .zip de Maven 3.9.16 en Maven Central; se guarda en ~/.m2/wrapper/dists la primera vez.
# - distributionSha256Sum: el SHA-256 del .zip; mvnw y mvnw.cmd lo comprueban al descargarlo y se niegan a usar uno
#   distinto. Se sacó el 3-nov-2026 del .zip ya verificado contra el SHA-512 oficial de Apache (apache-maven-3.9.16-
#   bin.zip.sha512). Al subir de versión de Maven, cambian los dos valores juntos.
