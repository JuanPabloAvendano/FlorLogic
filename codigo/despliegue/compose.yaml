# Nodo de la finca (TEC-28: Docker Compose): la base, el vault, la identidad (TEC-32), el backend y el gateway (TEC-15)
# con su WAF (TEC-31).
# El gateway es la única puerta: ni el backend ni el vault publican puertos (C-2). Los «WAF A-n» son de
# despliegue/ESPEC-waf-finca.md; los «A-n» y «C-n» sin prefijo, de despliegue/espec/ESPEC-esqueleto-tx1.md.
#
# Orden de arranque (A-30): base sana → openbao sano → openbao-init termina con 0 → backend, Keycloak y gateway.
# HTTPS en todo enlace (A-44, 1-nov-2026): la ceremonia de la CA de la finca (despliegue/pki/Ceremonia.java) deja en
# FLORLOGIC_PKI la raíz y el certificado de OpenBao (paso 1); openbao-init deja ahí el CSR de la intermedia y, con ella
# firmada (paso 2), emite los certificados del gateway, el backend y Keycloak (A-52…A-60). Variables del anfitrión: §3 de la ESPEC. Las de los secretos no tienen defecto y nunca van en git (A-10): en
# desarrollo, un .env fuera de git; en CI, secretos de GitHub Actions; en las pruebas, NodoCompose.
services:
  base:
    # TEC-06 · PostgreSQL 16.15 por digest, nunca una etiqueta móvil (COH-42; 0 avisos en OSV el 29-oct-2026).
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: unless-stopped               # vuelve sola tras un corte de luz (gateway A-12)
    environment:
      POSTGRES_DB: florlogic
      POSTGRES_USER: florlogic
      # Solo se aplica al crear el volumen datos: una máquina con el volumen viejo necesita un «down -v» una vez (A-25).
      POSTGRES_PASSWORD_FILE: /run/secrets/pg-admin
    secrets:
      - pg-admin
    ports:
      # Solo el anfitrión: la base no es otra puerta hacia la red (gateway A-12). Las pruebas ponen 0 (A-20).
      - "127.0.0.1:${FLORLOGIC_BASE_PUERTO:-5432}:5432"
    volumes:
      - datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "florlogic", "-d", "florlogic"]
      interval: 5s
      timeout: 3s
      retries: 10

  base-init:
    # IA_ (Claude, 31-oct-2026, CT-2 · SIN REVISAR) · La base de Keycloak, «keycloak», en el mismo PostgreSQL: se crea
    # si falta, en cada arranque (también sobre un volumen datos viejo, donde el initdb ya no corre). La misma imagen
    # que la base; de una sola vez, como openbao-init.
    image: postgres:16@sha256:1beaa3084eee2676f20a9cd9928f0bf2c5bf674f8e49f81017912183d377c61c
    restart: "no"
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -e
        export PGPASSWORD="$$(cat /run/secrets/pg-admin)" PGHOST=base PGUSER=florlogic PGDATABASE=florlogic
        psql -tAc "SELECT 1 FROM pg_database WHERE datname = 'keycloak'" | grep -q 1 || psql -qc "CREATE DATABASE keycloak"
    secrets:
      - pg-admin
    depends_on:
      base:
        condition: service_healthy

  keycloak:
    # IA_ (Claude, 31-oct-2026, CT-2 · SIN REVISAR) · TEC-32 · Keycloak 26.8.1 por digest (reconstrucción -2 del
    # 31-oct-2026; OSV sin avisos, Trivy: 0 críticos y 4 altos sin arreglo en la imagen, ver IA_TECNOLOGIAS-vigentes).
    # Sin ports: se llega por el gateway, en /auth/ y solo al realm florlogic (C-2). La consola de administración no
    # pasa por el gateway: se administra con «docker compose exec keycloak /opt/keycloak/bin/kcadm.sh» desde el nodo.
    image: quay.io/keycloak/keycloak:26.8.1-2@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    restart: unless-stopped
    # Keycloak no lee *_FILE: las dos claves salen de /run/secrets/ al arrancar y no quedan en «docker inspect» (A-10).
    entrypoint: ["bash", "-c"]
    command:
      - |
        export KC_DB_PASSWORD="$$(cat /run/secrets/pg-admin)" KC_BOOTSTRAP_ADMIN_PASSWORD="$$(cat /run/secrets/kc-admin)"
        export FLORLOGIC_WEB_SECRETO="$$(cat /run/secrets/web-secreto)"   # el import lo pone al cliente web (F4)
        exec /opt/keycloak/bin/kc.sh start --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://base:5432/keycloak
      KC_DB_USERNAME: florlogic
      # Solo HTTPS (A-44): el certificado lo emite openbao-init (A-47) y Keycloak lo relee cada hora. El emisor (iss)
      # es siempre esta URL, entre por donde entre la petición; el backend la compara (FLORLOGIC_IDENTIDAD_EMISOR).
      # backchannel-dynamic: lo que el backend pide por la red interna (las llaves) responde con direcciones internas.
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_PORT: "8443"
      KC_HTTPS_CERTIFICATE_FILE: /tls/servidor.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /tls/servidor.key
      # La salud y las métricas, solo en el loopback del contenedor: la imagen no trae con qué hablar TLS desde el
      # healthcheck, y así ese puerto no es un enlace de red (A-57).
      KC_HTTP_MANAGEMENT_SCHEME: http
      KC_HTTP_MANAGEMENT_HOST: 127.0.0.1
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${FLORLOGIC_NODO_URL:-https://localhost}/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_CACHE: local                     # un solo nodo: sin clúster ni JGroups
      # El administrador temporal del realm master: solo se crea en el primer arranque, con la clave del secreto cero.
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      FLORLOGIC_NODO_URL: ${FLORLOGIC_NODO_URL:-https://localhost}   # lo usa realm-florlogic.json al importar
    secrets:
      - pg-admin
      - kc-admin
      - web-secreto
    volumes:
      - ./keycloak/realm-florlogic.json:/opt/keycloak/data/import/realm-florlogic.json:ro
      - tls-keycloak:/tls:ro              # de openbao-init: dueño 1000 y 0400 (A-47)
    depends_on:
      base:
        condition: service_healthy
      base-init:
        condition: service_completed_successfully
      openbao-init:
        condition: service_completed_successfully   # sin su certificado no abre (A-44)
    # La imagen no trae curl ni wget: bash y /dev/tcp (A-30). La salud va en el puerto de gestión, solo en el loopback
    # (A-57), y se lee por el código: listo es 200 y arrancando 503 (el cuerpo DOWN trae «UP» por dentro y no sirve
    # para buscar). Con el puerto de gestión aparte, Keycloak pide Host: sin él responde 400.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /auth/health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '^HTTP/1.0 200' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 60s

  openbao:
    # CMP-20 · TEC-33…36: OpenBao 2.7.2 con el sello pkcs11. Fuera de la finca, SoftHSM; en la finca, el token USB
    # (A-22). La misma imagen en todos lados: cambian BAO_HSM_LIB y la bandera (A-27, A-29).
    build:
      context: ./openbao
      target: servidor
    restart: unless-stopped               # mientras K-24 siga abierta (A-28)
    environment:
      BAO_HSM_LIB: ${BAO_HSM_LIB:?falta BAO_HSM_LIB (fuera de la finca, /usr/lib/softhsm/libsofthsm2.so)}
      FLORLOGIC_SOFTHSM_CREAR: ${FLORLOGIC_SOFTHSM_CREAR:-}   # «si» solo en desarrollo, CI y pruebas (A-29)
    secrets:
      - hsm-pin
      - softhsm-so-pin
      - ca-raiz
      - bao-tls-crt
      - bao-tls-key
    volumes:
      - bao-datos:/openbao/data
      - softhsm-tokens:/var/lib/softhsm/tokens
    # Sin ports: (C-2). Sano = sin iniciar (para que openbao-init corra) o abierto; sellado no. bao status sale 2 sin
    # iniciar, pero igual responde: se mira lo que dice (A-28, COH-31). Por HTTPS y verificando contra la raíz (A-49);
    # el wget de la imagen no acepta una CA propia (COH-48).
    healthcheck:
      test: ["CMD", "sh", "-c", "bao status -format=json 2>/dev/null | grep -q -e '\"initialized\": false' -e '\"sealed\": false'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 10s

  openbao-init:
    # El orquestador de inicio (K-22): inicia y configura el vault en el primer arranque y comprueba en los siguientes.
    build:
      context: ./openbao
      target: init
    restart: "no"                         # de una sola vez; Docker no lo repite tras reiniciar el anfitrión (COH-1)
    environment:
      BAO_ADDR: https://openbao:8200
      FLORLOGIC_RED: ${FLORLOGIC_RED:-172.30.0.0/24}
      # Los nombres e IP por los que la finca llega al nodo, además de localhost (A-50): «nodo.finca.lan,192.168.1.10».
      FLORLOGIC_NODO_DIRECCIONES: ${FLORLOGIC_NODO_DIRECCIONES:-}
      # Segundos que espera la intermedia firmada; en la finca 0: sale ≠0 y dice qué firmar (A-56).
      FLORLOGIC_CEREMONIA_ESPERA: ${FLORLOGIC_CEREMONIA_ESPERA:-0}
    secrets:
      - pg-admin
      - ca-raiz
    volumes:
      - bao-estado:/bao/estado            # el raíz mientras dura la configuración, listo, la red y el emisor (A-40, K-47)
      - bao-entrega:/bao/entrega          # solo las partes de recuperación: el operador las saca (A-24)
      - bao-credenciales:/bao/credenciales
      # La carpeta de la ceremonia: el CSR de la intermedia sale y su certificado firmado vuelve (A-46, A-56). Nunca
      # lleva la llave de la raíz, que se queda en la custodia (A-45).
      - ${FLORLOGIC_PKI:?falta FLORLOGIC_PKI (la carpeta de la ceremonia de la CA de la finca)}:/bao/ceremonia
      - tls-gateway:/tls/gateway
      - tls-backend:/tls/backend
      - tls-keycloak:/tls/keycloak
    depends_on:
      base:
        condition: service_healthy
      openbao:
        condition: service_healthy

  backend:
    # CMP-3 · Dockerfile multietapa (A-9, A-34). El contexto es codigo/: el pom.xml padre, contrato y backend-finca.
    build:
      context: ..
      dockerfile: backend-finca/Dockerfile
    restart: unless-stopped               # sin vault para con «vault inalcanzable» y Docker lo reintenta (A-23)
    environment:
      FLORLOGIC_DB_URL: jdbc:postgresql://base:5432/florlogic
      # La credencial AppRole llega por configtree: (un archivo por propiedad) y la clave de la base, de KV (A-26).
      # Sin optional: y con fail-fast: sin vault el backend no arranca (A-23).
      # IA_ (Claude, 1-nov-2026, F4 · SIN REVISAR): configtree:/run/secrets/ trae florlogic.web.secreto, el secreto del
      # cliente web de Keycloak (ID-3); el archivo lleva el nombre de la propiedad.
      SPRING_CONFIG_IMPORT: "configtree:/bao/,configtree:/run/secrets/,vault://"
      SPRING_CLOUD_VAULT_ENABLED: "true"
      SPRING_CLOUD_VAULT_URI: https://openbao:8200
      SPRING_CLOUD_VAULT_AUTHENTICATION: APPROLE
      SPRING_CLOUD_VAULT_FAIL_FAST: "true"
      SPRING_CLOUD_VAULT_KV_BACKEND: kv
      SPRING_CLOUD_VAULT_KV_DEFAULT_CONTEXT: florlogic/backend-finca
      # Spring Cloud Vault también lee kv/<nombre de la aplicación> (kv/backend-finca); la política no lo deja y, con
      # fail-fast, el 403 tumba el arranque (comprobado 29-oct). Con el mismo valor, lee una sola ruta.
      SPRING_CLOUD_VAULT_KV_APPLICATION_NAME: florlogic/backend-finca
      # Servidor de recursos (CT-2): las llaves por la red interna; el emisor, el que firma Keycloak (KC_HOSTNAME).
      # Sin depends_on de keycloak: el backend pide las llaves con el primer token, no al arrancar.
      FLORLOGIC_IDENTIDAD_JWKS: https://keycloak:8443/auth/realms/florlogic/protocol/openid-connect/certs
      FLORLOGIC_IDENTIDAD_EMISOR: ${FLORLOGIC_NODO_URL:-https://localhost}/auth/realms/florlogic
      # La web (F4): el navegador va al emisor por el gateway; el backend canjea el código aquí, por la red interna.
      FLORLOGIC_IDENTIDAD_INTERNA: https://keycloak:8443/auth/realms/florlogic
      FLORLOGIC_FINCA_ZONA: ${FLORLOGIC_FINCA_ZONA:-America/Bogota}
      # HTTPS (A-44): el negocio en el 8443 con mTLS, solo entra quien presenta un certificado de la finca, o sea el
      # gateway (A-48); la salud y las métricas en el 8081, con TLS de servidor (A-49). Los certificados, de
      # openbao-init (A-47); la confianza en la raíz para OpenBao y Keycloak la arma arranque.sh (A-54).
      SERVER_PORT: "8443"
      SERVER_SSL_BUNDLE: servidor
      SERVER_SSL_CLIENT_AUTH: need
      SPRING_SSL_BUNDLE_PEM_SERVIDOR_KEYSTORE_CERTIFICATE: file:/tls/servidor.crt
      SPRING_SSL_BUNDLE_PEM_SERVIDOR_KEYSTORE_PRIVATE_KEY: file:/tls/servidor.key
      SPRING_SSL_BUNDLE_PEM_SERVIDOR_TRUSTSTORE_CERTIFICATE: file:/tls/raiz.crt
      MANAGEMENT_SERVER_PORT: "8081"
      MANAGEMENT_SERVER_SSL_BUNDLE: servidor
      MANAGEMENT_SERVER_SSL_CLIENT_AUTH: none
    secrets:
      - source: web-secreto
        target: florlogic.web.secreto
    volumes:
      - bao-credenciales:/bao:ro          # solo lectura; los archivos son del uid 10001 y 0400 (A-15)
      - tls-backend:/tls:ro               # fuera de /bao: configtree leería cada archivo como propiedad (COH-51)
    depends_on:
      base:
        condition: service_healthy
      openbao:
        condition: service_healthy
      openbao-init:
        condition: service_completed_successfully
    # Sin ports: el gateway es la única puerta (C-2). La imagen JRE trae openssl: la salud por HTTPS en el puerto de
    # gestión, verificando el certificado contra la raíz y el nombre (A-49).
    healthcheck:
      test: ["CMD", "bash", "-c", "printf 'GET /actuator/health HTTP/1.0\\r\\nHost: backend\\r\\n\\r\\n' | openssl s_client -quiet -ign_eof -connect 127.0.0.1:8081 -servername backend -verify_hostname backend -verify_return_error -CAfile /tls/raiz.crt 2>/dev/null | grep -q '\"UP\"'"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 40s

  gateway:
    # TEC-31 · WAF de la finca: ModSecurity v3 y OWASP CRS 4.30.0 sobre la Nginx 1.30.6 de TEC-15, con fecha fija,
    # nunca una etiqueta móvil (WAF A-12). CanalPorGatewayTest lee esta línea para probar la misma imagen.
    image: owasp/modsecurity-crs:4.30.0-nginx-alpine-202610180210
    restart: unless-stopped
    ports:
      # Solo HTTPS, sin puerto 80 ni para redirigir: una redirección ya es una petición en claro (A-44, A-51). La
      # imagen corre sin privilegios: escucha en el 8443 (WAF A-8).
      - "${FLORLOGIC_GATEWAY_PUERTO:-443}:8443"
    environment:
      FLORLOGIC_BACKEND: ${FLORLOGIC_BACKEND:-backend:8443}
      FLORLOGIC_IDENTIDAD: ${FLORLOGIC_IDENTIDAD:-keycloak:8443}   # CT-2: /auth/ va a Keycloak
      FLORLOGIC_DNS: ${FLORLOGIC_DNS:-127.0.0.11}     # el DNS de Docker; el resolver lo busca en cada petición (A-17, A-18)
      FLORLOGIC_WAF_MODO: ${FLORLOGIC_WAF_MODO:-On}   # On bloquea; DetectionOnly solo anota (WAF A-2)
      # Sin NGINX_ENVSUBST_FILTER: las plantillas de la imagen usan sus propias variables (PORT, MODSEC_…) (WAF A-8).
    # Sin depends_on del backend: arranca solo y responde 502 mientras el backend no contesta (A-17). Sí espera a
    # openbao-init: sin su certificado no abre (A-44).
    depends_on:
      openbao-init:
        condition: service_completed_successfully
    # El de la imagen consulta https://localhost:8443/healthz, que este servidor no tiene, y lo deja «unhealthy».
    # Cualquier respuesta HTTPS del 8443, también el 404 de /, dice que Nginx está arriba (WAF A-8), con el
    # certificado verificado contra la raíz (A-49).
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "--cacert", "/tls/raiz.crt", "https://localhost:8443/"]
      interval: 5s
      timeout: 3s
      retries: 3
    volumes:
      # Solo nuestros dos archivos, uno por uno: montar la carpeta taparía las plantillas de la imagen (WAF A-8).
      - ./gateway/default.conf.template:/etc/nginx/templates/conf.d/default.conf.template:ro
      - ./gateway/modsecurity-override.conf.template:/etc/nginx/templates/modsecurity.d/modsecurity-override.conf.template:ro
      - tls-gateway:/tls:ro               # de openbao-init: dueño nginx (101) y 0400 (A-47)

  # ── Perfiles opcionales (IA_, Claude subagente, 31-oct-2026, SIN REVISAR) ─────────────────────────────────────────
  # «docker compose up» sin perfiles levanta el mismo nodo de siempre; estos servicios solo arrancan con
  # «--profile calidad» o «--profile observabilidad» (TEC-39…41). Ninguno es puerta hacia la red: publican solo en
  # 127.0.0.1 del anfitrión, y /actuator sigue sin pasar por el gateway.

  sonarqube:
    # TEC-39 · SonarQube Community Build 26.10 por digest. Base H2 embebida: solo para analizar en desarrollo, nunca
    # en la finca. El análisis lo manda «./mvnw sonar:sonar» desde el anfitrión (codigo/IA_LEEME.md).
    image: sonarqube:26.10.0.133078-community@sha256:f95aaa9016dd4e92c7d70691167a6d96dbb5d8acffd61eba1cb4335d364a7840
    profiles: ["calidad"]
    environment:
      # Elasticsearch interno sin mmap: no pide subir vm.max_map_count en el anfitrión.
      SONAR_SEARCH_JAVAADDITIONALOPTS: "-Dnode.store.allow_mmap=false"
      SONAR_TELEMETRY_ENABLE: "false"
    ports:
      - "127.0.0.1:${FLORLOGIC_SONAR_PUERTO:-9000}:9000"
    volumes:
      - sonar-datos:/opt/sonarqube/data
      - sonar-extensiones:/opt/sonarqube/extensions
    healthcheck:
      # La imagen no trae curl ni wget: bash y /dev/tcp, como el backend (A-30).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /api/system/status HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"status\":\"UP\"' <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  prometheus:
    # TEC-41 · Prometheus 3.15.1 por digest: raspa https://backend:8081/actuator/prometheus por la red interna del
    # nodo, verificando el certificado del backend contra la raíz de la finca (A-44, A-49).
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    profiles: ["observabilidad"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    ports:
      - "127.0.0.1:${FLORLOGIC_PROMETHEUS_PUERTO:-9090}:9090"
    secrets:
      - ca-raiz
    volumes:
      - ./observabilidad/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-datos:/prometheus

  loki:
    # TEC-41 · Loki 3.7.9 por digest: guarda los registros de los contenedores. Sin puerto publicado.
    image: grafana/loki:3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
    profiles: ["observabilidad"]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observabilidad/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-datos:/loki

  alloy:
    # TEC-41 · Grafana Alloy 1.21.3 por digest: lee la salida estándar de los contenedores de este proyecto por el
    # socket de Docker (solo lectura) y la manda a Loki (Twelve-Factor «Logs»).
    image: grafana/alloy:v1.21.3@sha256:8ab871206bd2d8f89277f53abffee5f452a293980788d52f85fa183a87a505a4
    profiles: ["observabilidad"]
    restart: unless-stopped
    command: ["run", "--disable-reporting", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy"]
    environment:
      FLORLOGIC_PROYECTO: ${COMPOSE_PROJECT_NAME}    # solo los contenedores de este nodo
    volumes:
      - ./observabilidad/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  grafana:
    # TEC-41 · Grafana 13.2.5 por digest, con Prometheus, Loki y el tablero del backend aprovisionados al arrancar.
    # Solo en 127.0.0.1 y sin cuentas: entra cualquiera del anfitrión como lector (con Explore); no hay clave que
    # guardar en el .env. Los tableros vienen de archivos y no se editan desde la web.
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    profiles: ["observabilidad"]
    restart: unless-stopped
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_VIEWERS_CAN_EDIT: "true"            # Explore para los lectores, sin poder guardar tableros
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/backend-finca.json
    ports:
      - "127.0.0.1:${FLORLOGIC_GRAFANA_PUERTO:-3000}:3000"
    volumes:
      - ./observabilidad/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./observabilidad/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-datos:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

# El secreto cero: lo que existe antes de «up». Llega de una variable del anfitrión, se monta como archivo en
# /run/secrets/ y no se ve en el entorno del contenedor; si la variable falta, Compose para (A-10).
secrets:
  pg-admin:
    environment: FLORLOGIC_PG_ADMIN
  hsm-pin:
    environment: FLORLOGIC_HSM_PIN
  softhsm-so-pin:
    environment: FLORLOGIC_SOFTHSM_SO_PIN
  kc-admin:
    environment: FLORLOGIC_KC_ADMIN       # el administrador del realm master de Keycloak (CT-2)
  web-secreto:
    environment: FLORLOGIC_WEB_SECRETO    # el secreto del cliente web de Keycloak: lo comparten Keycloak y el backend (F4)
  # El paso 1 de la ceremonia (A-46): la raíz pública y el certificado del listener de OpenBao, firmado por ella. Son
  # archivos de FLORLOGIC_PKI, no variables: la llave de OpenBao no pasa por el entorno (COH-44).
  ca-raiz:
    file: ${FLORLOGIC_PKI:?falta FLORLOGIC_PKI}/raiz.crt
  bao-tls-crt:
    file: ${FLORLOGIC_PKI:?falta FLORLOGIC_PKI}/openbao.crt
  bao-tls-key:
    file: ${FLORLOGIC_PKI:?falta FLORLOGIC_PKI}/openbao.key

# La subred del nodo: el AppRole del backend solo sirve desde ella (A-35). Cada prueba pone la suya (A-42).
networks:
  default:
    ipam:
      config:
        - subnet: ${FLORLOGIC_RED:-172.30.0.0/24}

volumes:
  datos:
  bao-datos:            # el almacenamiento raft de OpenBao (A-12)
  softhsm-tokens:       # el token SoftHSM; fuera de la finca (A-29)
  bao-estado:
  bao-entrega:
  bao-credenciales:
  tls-gateway:          # los certificados que emite openbao-init, uno por servicio (A-47, COH-51)
  tls-backend:
  tls-keycloak:
  sonar-datos:          # perfil calidad (TEC-39)
  sonar-extensiones:
  prometheus-datos:     # perfil observabilidad (TEC-41)
  loki-datos:
  grafana-datos:

# ── Guía de lectura · IA (Claude), 3-nov-2026, a pedido de Juan · SIN REVISAR ──
# Propósito: describe el nodo de la finca completo como contenedores de Docker Compose (base, vault, identidad,
# backend y gateway) y, con perfiles, las herramientas de calidad y observabilidad.
# Uso: desde codigo/despliegue/, con las variables FLORLOGIC_ del anfitrión (un .env fuera de git en desarrollo,
# secretos en CI, NodoCompose en las pruebas): «docker compose up -d»; con extras, «docker compose --profile
# observabilidad up -d» o «--profile calidad». Antes del primer arranque va el paso 1 de la ceremonia de la CA
# (pki/Ceremonia.java raiz).
# Origen: la cabecera de arriba (ESPEC-esqueleto-tx1, ESPEC-waf-finca, ESPEC-gateway-finca; TEC-28 es Compose).
# Línea por línea (lo no obvio):
# - Interpolación de Compose: «signo de pesos, llaves, VAR:-valor» usa valor si VAR falta o está vacía; «VAR:?texto»
#   detiene Compose con ese texto si falta. «$$» en command se vuelve un «$» literal para el shell del contenedor
#   (si no, Compose intentaría sustituirlo).
# - image: nombre:etiqueta@sha256:…: fija la imagen por huella. build: context + target / dockerfile: se construye
#   aquí; target elige la etapa del Dockerfile multietapa.
# - restart: unless-stopped: Docker lo vuelve a arrancar (tras un fallo o un reinicio del anfitrión) salvo que una
#   persona lo haya detenido. restart: "no" (entre comillas, porque no sin comillas sería booleano en YAML): corre
#   una vez.
# - environment: variables de entorno del contenedor. POSTGRES_PASSWORD_FILE: la imagen de PostgreSQL lee la clave de
#   ese archivo en vez de una variable.
# - secrets: (en el servicio) monta cada secreto como archivo en /run/secrets/<nombre>; con source/target se le da
#   otro nombre de archivo. secrets: (abajo, global) define de dónde sale: environment: lo toma de una variable del
#   anfitrión, file: de un archivo.
# - ports: "127.0.0.1:anfitrión:contenedor": publica solo en el loopback del anfitrión; sin IP publica en todas las
#   interfaces (solo el gateway).
# - volumes: nombre:/ruta usa un volumen con nombre (definido al final); ./ruta:/ruta:ro monta un archivo o carpeta del
#   repo en solo lectura.
# - healthcheck: test con CMD ejecuta esa orden dentro del contenedor; interval, timeout, retries y start_period
#   (gracia inicial en que los fallos no cuentan) deciden cuándo es «healthy».
# - pg_isready: la herramienta de PostgreSQL que dice si ya acepta conexiones.
# - exec 3<>/dev/tcp/127.0.0.1/9000: truco de bash que abre una conexión TCP como el descriptor 3; con printf … >&3
#   se manda una petición HTTP a mano y con grep … <&3 se lee la respuesta. Se usa porque la imagen no trae curl.
# - openssl s_client -quiet -ign_eof -connect … -servername backend -verify_hostname backend -verify_return_error
#   -CAfile: abre TLS hacia el puerto de gestión, exige que el certificado sea de «backend» y firmado por la raíz, y
#   falla si no; -ign_eof espera la respuesta aunque se acabe la entrada.
# - depends_on con condition: service_healthy (espera a que esté sano) o service_completed_successfully (espera a que
#   termine con 0). Así se arma el orden base, openbao, openbao-init, y luego backend, Keycloak y gateway.
# - entrypoint ["sh", "-c"] + command con «- |»: reemplaza el arranque de la imagen por un guion de shell en bloque
#   literal YAML (el «|» conserva los saltos de línea).
# - psql … | grep -q 1 || psql -qc "CREATE DATABASE keycloak": crea la base solo si la consulta no devolvió 1.
# - kc.sh start --import-realm: arranca Keycloak en modo producción e importa los realm JSON de data/import (solo si
#   el realm no existe todavía).
# - KC_*: configuración de Keycloak por variables. KC_HTTP_ENABLED "false": sin HTTP plano. KC_HTTPS_*: puerto y
#   certificado. KC_HTTP_MANAGEMENT_*: salud y métricas en el puerto 9000, por HTTP y solo en 127.0.0.1.
#   KC_HTTP_RELATIVE_PATH /auth: todo cuelga de /auth. KC_HOSTNAME: la URL pública fija (y el emisor de los tokens).
#   KC_HOSTNAME_BACKCHANNEL_DYNAMIC: las llamadas internas reciben direcciones internas. KC_PROXY_HEADERS xforwarded:
#   confía en las cabeceras X-Forwarded del gateway. KC_HEALTH_ENABLED: activa /health. KC_CACHE local: sin clúster.
#   KC_BOOTSTRAP_ADMIN_*: el administrador inicial.
# - BAO_HSM_LIB: la biblioteca PKCS#11 (SoftHSM o la del token USB) que usa el sello.
# - SPRING_*, SERVER_*, MANAGEMENT_*: Spring Boot traduce cada variable a una propiedad (SERVER_PORT es server.port).
#   SPRING_CONFIG_IMPORT "configtree:/bao/,configtree:/run/secrets/,vault://": carga como propiedades los archivos de
#   esas carpetas (el nombre del archivo es la propiedad) y luego el vault. SPRING_CLOUD_VAULT_*: dirección, entrada
#   por AppRole, fail-fast (no arranca sin vault) y la ruta KV que lee.
# - SERVER_SSL_BUNDLE servidor + SPRING_SSL_BUNDLE_PEM_SERVIDOR_*: un «SSL bundle» de Spring Boot llamado servidor,
#   armado con archivos PEM (certificado, llave y raíz de confianza). SERVER_SSL_CLIENT_AUTH need: el 8443 exige
#   certificado de cliente (mTLS). MANAGEMENT_SERVER_PORT 8081 con CLIENT_AUTH none: el puerto de Actuator, TLS sin
#   certificado de cliente.
# - curl -s -o /dev/null --cacert: en el gateway, comprueba que el 8443 responda HTTPS válido (sin -f, un 404 también
#   cuenta como vivo).
# - profiles: ["calidad"] u ["observabilidad"]: el servicio solo arranca si se pide ese perfil.
# - SONAR_SEARCH_JAVAADDITIONALOPTS "-Dnode.store.allow_mmap=false": el Elasticsearch interno no usa mmap, así no hay
#   que subir vm.max_map_count en el anfitrión.
# - --storage.tsdb.retention.time=15d: Prometheus guarda 15 días de métricas.
# - alloy run --disable-reporting --storage.path: corre la configuración sin mandar estadísticas de uso.
# - /var/run/docker.sock:…:ro: Alloy pregunta a Docker por los contenedores y sus registros.
# - GF_*: configuración de Grafana por variables: entrada anónima como lector (Viewer), sin formulario de ingreso,
#   lectores con Explore, sin telemetría, y el tablero de inicio.
# - networks.default.ipam.config.subnet: fija la subred de la red del proyecto; el AppRole solo vale desde ella.
# - volumes: (al final) declara los volúmenes con nombre; Docker los crea vacíos la primera vez y «down -v» los borra.
