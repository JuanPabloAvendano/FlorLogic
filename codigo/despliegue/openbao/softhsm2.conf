# IA_ · Configuración de SoftHSM, el token PKCS#11 en software de desarrollo, CI y pruebas (TEC-36)
# Quién: IA (Claude), 29-oct-2026, a pedido de Juan (Segmento 1a) · Estado: SIN REVISAR
# Manda por encima: despliegue/espec/ESPEC-esqueleto-tx1.md A-29, COH-34
# La lee SoftHSM por SOFTHSM2_CONF. El token vive en el volumen softhsm-tokens: si quedara dentro del contenedor,
# recrearlo perdería la llave y el vault no se abriría más (K-42).

directories.tokendir = /var/lib/softhsm/tokens
objectstore.backend = file
log.level = ERROR
slots.removable = false

# ── Guía de lectura · IA (Claude), 3-nov-2026, a pedido de Juan · SIN REVISAR ──
# Propósito: dice a SoftHSM dónde y cómo guardar el token PKCS#11 de software.
# Uso: el Dockerfile la copia a /etc/softhsm2.conf y la variable SOFTHSM2_CONF apunta a ella; la leen softhsm2-util,
# pkcs11-tool (vía la biblioteca) y el complemento pkcs11 de OpenBao. En la finca no se usa (hay token USB).
# Origen: la cabecera de arriba (ESPEC-esqueleto-tx1).
# Línea por línea (lo no obvio):
# - directories.tokendir: carpeta de los tokens; es el volumen softhsm-tokens para que sobreviva a recrear el contenedor.
# - objectstore.backend = file: cada objeto del token es un archivo (la otra opción, db, pide SQLite).
# - log.level = ERROR: solo registra errores, no cada operación.
# - slots.removable = false: el token se presenta como fijo, no extraíble.
