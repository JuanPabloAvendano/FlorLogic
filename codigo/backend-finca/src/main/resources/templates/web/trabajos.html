<!DOCTYPE html>
<!--/* IA_ · Cola del gerente (F4, P-S01) · Claude, 1-nov-2026 · SIN REVISAR · manda IA_CONSTRUCCION-TX1 CT-12 */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{web/plantilla :: cabeza('Trabajos')}"></head>
<body th:attr="hx-headers=${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}">
<header th:replace="~{web/plantilla :: menu}"></header>
<main>
  <h1>Trabajos del gerente</h1>
  <p>Anotaciones que entraron marcadas: revísalas y dalas por resueltas.</p>
  <p th:if="${trabajos.isEmpty()}" class="vacio">Nada pendiente.</p>
  <table th:unless="${trabajos.isEmpty()}">
    <thead><tr><th>Abierto</th><th>Jornada</th><th>Sección</th><th>Motivo</th><th>Celular</th><th>Anotación</th><th></th></tr></thead>
    <tbody>
    <tr th:each="t : ${trabajos}" th:id="'t-' + ${t.anotacion}">
      <td th:text="${#temporals.format(t.abiertoEn, 'yyyy-MM-dd HH:mm')}">fecha</td>
      <td th:text="${t.jornada}">jornada</td>
      <td th:text="${t.seccion}">sección</td>
      <td><span class="codigo" th:each="c : ${t.codigos}" th:text="${c}">incompleta</span></td>
      <td><code th:text="${t.dispositivo}">uuid</code></td>
      <td><code th:text="${t.anotacion}">uuid</code></td>
      <td>
        <form th:action="@{/web/trabajos/{a}/resolver(a=${t.anotacion})}" method="post"
              th:attr="hx-post=@{/web/trabajos/{a}/resolver(a=${t.anotacion})},hx-target='#t-' + ${t.anotacion}" hx-swap="outerHTML">
          <button type="submit">Resuelto</button>
        </form>
      </td>
    </tr>
    </tbody>
  </table>
  <!--/* Lo que reemplaza la fila al resolverla con htmx; en la página entera no hay porOtro y no se pinta. */-->
  <th:block th:fragment="resuelta" th:if="${porOtro != null}">
    <tr class="resuelta"><td colspan="7" th:text="${porOtro} ? 'Ya lo había resuelto otro gerente.' : 'Resuelto.'">Resuelto.</td></tr>
  </th:block>
</main>
</body>
</html>

<!--/*
  ── Guía de lectura · IA (Claude), 3-nov-2026, a pedido de Juan · SIN REVISAR ──
  (Comentario de Thymeleaf, de barra y asterisco: se borra al procesar la plantilla y no llega al navegador.)
  Propósito: la cola del gerente: anotaciones que entraron marcadas, con el botón para darlas por resueltas.
  Uso: el controlador de la web la pinta en GET de /web/trabajos; «Resuelto» hace POST con htmx a
  /web/trabajos/{a}/resolver y el backend responde con el pedazo resuelta, que reemplaza la fila.
  Origen: la cabecera de arriba (IA_CONSTRUCCION-TX1, tarjeta CT-12; P-S01 es la cola del gerente).
  Lo no obvio:
  - body th:attr="hx-headers=…": el token CSRF como cabecera en todas las peticiones de htmx (ver tablero.html).
  - th:each sobre t.codigos dentro del span: repite el span por cada código de motivo.
  - hx-post (vía th:attr) y hx-target='#t-…': htmx manda el POST y reemplaza la fila con ese id. hx-swap="outerHTML":
    la fila entera, no su contenido.
  - th:block th:fragment="resuelta": el pedazo que el backend devuelve solo (vista «web/trabajos :: resuelta») con
    porOtro en el modelo. th:if="porOtro != null": al pintar la página completa no hay porOtro y el pedazo no
    sale (antes aparecía un «Resuelto.» suelto fuera de la tabla).
  - colspan="7": la celda ocupa las siete columnas de la tabla.
  - porOtro ? 'Ya lo había…' : 'Resuelto.': operador condicional de Thymeleaf; cambia el texto si otro gerente ya lo
    había resuelto.
*/-->
