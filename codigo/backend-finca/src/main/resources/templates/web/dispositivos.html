<!DOCTYPE html>
<!--/* IA_ · Celulares del nodo (F4, CT-10) · Claude, 1-nov-2026 · SIN REVISAR · manda IA_CONSTRUCCION-TX1 CT-10 */-->
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{web/plantilla :: cabeza('Celulares')}"></head>
<body th:attr="hx-headers=${'{&quot;' + _csrf.headerName + '&quot;:&quot;' + _csrf.token + '&quot;}'}">
<header th:replace="~{web/plantilla :: menu}"></header>
<main>
  <h1>Celulares</h1>
  <p>Un celular nuevo queda <em>pendiente</em> y lo suyo entra marcado hasta que lo apruebes. Uno bloqueado no puede
    abrir sesión.</p>
  <p th:if="${dispositivos.isEmpty()}" class="vacio">Ningún celular ha abierto sesión todavía.</p>
  <table th:unless="${dispositivos.isEmpty()}">
    <thead><tr><th>Celular</th><th>Estado</th><th>Visto por primera vez</th><th>Último cambio</th><th></th></tr></thead>
    <tbody>
    <!--/* El th:each va afuera: así el pedazo «fila» se puede pintar solo, con un d, al aprobar o bloquear con htmx. */-->
    <th:block th:each="d : ${dispositivos}">
    <tr th:fragment="fila" th:id="'d-' + ${d.id}" th:classappend="${d.pendiente} ? 'atencion'">
      <td><code th:text="${d.id}">uuid</code></td>
      <td><span class="estado" th:classappend="${#strings.toLowerCase(d.estado)}" th:text="${d.estado}">PENDIENTE</span></td>
      <td th:text="${#temporals.format(d.vistoPorPrimeraVez, 'yyyy-MM-dd HH:mm')}">fecha</td>
      <td th:text="${#temporals.format(d.cambiadoEn, 'yyyy-MM-dd HH:mm')} + ' · ' + ${d.cambiadoPor}">fecha · quién</td>
      <td class="acciones">
        <form th:action="@{/web/dispositivos/{id}/aprobar(id=${d.id})}" method="post"
              th:attr="hx-post=@{/web/dispositivos/{id}/aprobar(id=${d.id})},hx-target='#d-' + ${d.id}" hx-swap="outerHTML">
          <button type="submit" th:disabled="${d.estado == 'APROBADO'}">Aprobar</button>
        </form>
        <form th:action="@{/web/dispositivos/{id}/bloquear(id=${d.id})}" method="post"
              th:attr="hx-post=@{/web/dispositivos/{id}/bloquear(id=${d.id})},hx-target='#d-' + ${d.id}" hx-swap="outerHTML"
              hx-confirm="¿Bloquear este celular? No podrá entregar más anotaciones.">
          <button type="submit" class="peligro" th:disabled="${d.estado == 'BLOQUEADO'}">Bloquear</button>
        </form>
      </td>
    </tr>
    </th:block>
    </tbody>
  </table>
</main>
</body>
</html>

<!--/*
  ── Guía de lectura · IA (Claude), 3-nov-2026, a pedido de Juan · SIN REVISAR ──
  (Comentario de Thymeleaf, de barra y asterisco: se borra al procesar la plantilla y no llega al navegador.)
  Propósito: la lista de celulares del nodo, con su estado, y los botones para aprobarlos o bloquearlos.
  Uso: el controlador de la web la pinta en GET de /web/dispositivos; aprobar y bloquear van por POST con htmx y el
  backend devuelve solo el pedazo fila de ese celular. Sin JavaScript, los mismos formularios funcionan por POST normal.
  Origen: la cabecera de arriba (IA_CONSTRUCCION-TX1, tarjeta CT-10 celulares del nodo).
  Lo no obvio:
  - body th:attr="hx-headers=…": el token CSRF como cabecera en todas las peticiones de htmx (ver tablero.html).
  - th:block: elemento de Thymeleaf que no sale en el HTML; aquí solo lleva el th:each.
  - th:fragment="fila": la fila que el backend puede devolver sola (vista «web/dispositivos :: fila»).
  - th:id="'d-' + d.id": id único por fila, para que htmx sepa cuál reemplazar.
  - #strings.toLowerCase: pasa el estado a minúsculas para usarlo como clase CSS (pendiente, aprobado, bloqueado).
  - #temporals.format(fecha, 'yyyy-MM-dd HH:mm'): utilidad de Thymeleaf para fechas de java.time.
  - hx-post (vía th:attr): htmx manda el formulario por POST a esa URL sin recargar la página.
  - hx-target='#d-…': el elemento que se reemplaza con la respuesta (la fila). hx-swap="outerHTML": se reemplaza la
    fila entera.
  - hx-confirm: htmx pide confirmación con el diálogo del navegador antes de bloquear.
  - th:disabled: deshabilita el botón si la condición se cumple (no se aprueba lo aprobado ni se bloquea lo bloqueado).
*/-->
