<title>FlorLogic — Captura (vista rápida)</title>
<style>
/*
 * FlorLogic — captura. Estilos del prototipo.
 *
 * Decisiones que vienen de las respuestas de caracterización:
 *  UXP «pantalla legible bajo el sol directo»  -> contraste alto, sin grises intermedios.
 *  UXP «captura con guantes puestos»           -> blanco de toque mínimo 56 px.
 *  ACC «nunca depender solo del color»         -> todo estado lleva símbolo y palabra.
 *  ACC «botones grandes, sin precisión fina»   -> separación generosa, nada de iconos sueltos.
 */

:root {
  --fondo: #f7f8f7;
  --superficie: #ffffff;
  --borde: #c9d1cc;
  --texto: #10140f;
  --texto-tenue: #4a544d;
  --marca: #0f5132;
  --marca-suave: #e3f0e8;
  --ok: #0b6b3a;
  --aviso: #8a5300;
  --aviso-suave: #fdf3e0;
  --alerta: #a01919;
  --alerta-suave: #fdeaea;
  --toque: 56px;
  --radio: 12px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --fondo: #0b0f0d;
    --superficie: #151b17;
    --borde: #2d3a33;
    --texto: #f2f5f3;
    --texto-tenue: #a8b5ad;
    --marca: #7dd3a4;
    --marca-suave: #14301f;
    --ok: #7dd3a4;
    --aviso: #f0b959;
    --aviso-suave: #2e2410;
    --alerta: #f08a8a;
    --alerta-suave: #331616;
  }
}

* { box-sizing: border-box; }

html, body, #raiz { height: 100%; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 17px;
  line-height: 1.45;
  -webkit-text-size-adjust: 100%;
}

.app { display: flex; flex-direction: column; min-height: 100%; }

/* --- cabecera ------------------------------------------------------------- */
.cabecera {
  position: sticky; top: 0; z-index: 10;
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
  gap: 8px 12px;
  padding: 10px 16px calc(10px + env(safe-area-inset-top)) 16px;
  background: var(--superficie);
  border-bottom: 2px solid var(--borde);
}
.cabecera__marca {
  display: flex; flex-direction: column; align-items: flex-start;
  background: none; border: 0; padding: 6px 0; color: inherit; font: inherit; cursor: pointer;
  text-align: left; white-space: nowrap;
}
.cabecera__marca strong { color: var(--marca); letter-spacing: -0.01em; }
.cabecera__sub { font-size: 13px; color: var(--texto-tenue); }
/* Con dos o tres etiquetas de estado esto se sale de un celular: que bajen de línea. */
.cabecera__estado {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 8px;
}
.cabecera__estado .boton { padding: 0 14px; }

/* --- contenido ------------------------------------------------------------ */
.contenido { flex: 1; padding: 16px 16px 32px; max-width: 720px; width: 100%; margin: 0 auto; }
.titulo { font-size: 26px; margin: 12px 0 2px; letter-spacing: -0.02em; }
.subtitulo { margin: 0 0 18px; color: var(--texto-tenue); font-size: 15px; }
.seccion__titulo { font-size: 18px; margin: 28px 0 10px; }
.nota { margin-top: 28px; color: var(--texto-tenue); font-size: 14px; }

/* --- listas y tarjetas ---------------------------------------------------- */
.lista { display: flex; flex-direction: column; gap: 10px; }
.lista--densa { gap: 8px; }

.tarjeta {
  display: block; width: 100%; text-align: left;
  min-height: var(--toque);
  padding: 14px 16px;
  background: var(--superficie);
  border: 2px solid var(--borde);
  border-radius: var(--radio);
  color: inherit; font: inherit;
}
.tarjeta--pulsable { cursor: pointer; }
.tarjeta--pulsable:active { background: var(--marca-suave); }
.tarjeta--pulsable:focus-visible { outline: 3px solid var(--marca); outline-offset: 2px; }
.tarjeta__fila { display: flex; align-items: center; justify-content: space-between; }
.tarjeta__codigo { font-size: 19px; font-weight: 650; }
.tarjeta__flecha { color: var(--texto-tenue); font-size: 24px; line-height: 1; }
.tarjeta__meta {
  display: flex; flex-wrap: wrap; gap: 6px 14px;
  margin-top: 6px; color: var(--texto-tenue); font-size: 14px;
}

/* --- botones -------------------------------------------------------------- */
.boton {
  min-height: var(--toque); min-width: var(--toque);
  padding: 0 18px;
  border-radius: var(--radio);
  border: 2px solid var(--marca);
  background: var(--marca); color: var(--fondo);
  font: inherit; font-weight: 600; cursor: pointer;
}
.boton--tenue { background: transparent; color: var(--marca); }
.boton:focus-visible { outline: 3px solid var(--marca); outline-offset: 2px; }

/* --- etiquetas de estado -------------------------------------------------- */
.etiqueta {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: 999px;
  font-size: 13px; font-weight: 600; white-space: nowrap;
  border: 1.5px solid currentColor;
}
.etiqueta--ok { color: var(--ok); }
.etiqueta--aviso { color: var(--aviso); background: var(--aviso-suave); }
.etiqueta--alerta { color: var(--alerta); background: var(--alerta-suave); }
.etiqueta--neutro { color: var(--texto-tenue); }

/* --- detalle de la cama --------------------------------------------------- */
.jornada { margin-top: 20px; }
.jornada__fecha {
  display: flex; align-items: center; gap: 10px;
  font-size: 15px; color: var(--texto-tenue); margin: 0 0 8px; font-weight: 600;
}
.seccion {
  padding: 14px 16px; margin-bottom: 10px;
  background: var(--superficie); border: 2px solid var(--borde); border-radius: var(--radio);
}
.seccion__cabeza { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
.seccion__variedad { font-size: 19px; font-weight: 650; }
.seccion__hoja { font-size: 12px; color: var(--texto-tenue); }

.datos { display: grid; grid-template-columns: auto 1fr; gap: 4px 16px; margin: 10px 0 0; }
.datos dt { color: var(--texto-tenue); font-size: 14px; }
.datos dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.datos em { font-weight: 400; color: var(--texto-tenue); font-size: 13px; }

/* --- captura -------------------------------------------------------------- */
.acciones { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0; }

.captura {
  margin-top: 16px; padding: 14px; border-radius: var(--radio);
  border: 2px solid var(--marca); background: var(--superficie);
}
.captura__cabeza {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  margin-bottom: 12px;
}
.captura__guardado { font-size: 13px; color: var(--texto-tenue); }

.formulario { display: flex; flex-direction: column; gap: 12px; margin-top: 12px; }
.campo { display: flex; flex-direction: column; gap: 5px; }
.campo__etiqueta { font-size: 14px; color: var(--texto-tenue); font-weight: 600; }
.campo__control {
  min-height: var(--toque);
  padding: 0 14px;
  font: inherit; font-size: 19px; font-variant-numeric: tabular-nums;
  color: var(--texto); background: var(--fondo);
  border: 2px solid var(--borde); border-radius: var(--radio);
}
.campo__control:focus { outline: 3px solid var(--marca); outline-offset: 1px; border-color: var(--marca); }

/* --- avisos --------------------------------------------------------------- */
.aviso {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  margin: 8px 0; padding: 10px 12px;
  background: var(--aviso-suave); border-left: 4px solid var(--aviso);
  border-radius: 6px; font-size: 15px;
}
.aviso--neutro { background: var(--superficie); border-left-color: var(--borde); }
.aviso__origen { color: var(--texto-tenue); font-size: 13px; }

/* --- cifras y tabla ------------------------------------------------------- */
.cifras { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; }
.cifra {
  padding: 12px; text-align: center;
  background: var(--superficie); border: 2px solid var(--borde); border-radius: var(--radio);
}
.cifra__n { display: block; font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
.cifra__etiqueta { font-size: 13px; color: var(--texto-tenue); }

.tabla { width: 100%; border-collapse: collapse; font-size: 15px; }
.tabla th, .tabla td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--borde); }
.tabla th { color: var(--texto-tenue); font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em; }

/* --- vacíos y pie --------------------------------------------------------- */
.vacio { padding: 48px 24px; text-align: center; }
.vacio__titulo { font-size: 19px; font-weight: 650; margin: 0 0 6px; }
.vacio__detalle { color: var(--texto-tenue); margin: 0; }

.pie {
  display: flex; gap: 8px; justify-content: center;
  padding: 14px 16px calc(14px + env(safe-area-inset-bottom));
  color: var(--texto-tenue); font-size: 12px;
  border-top: 1px solid var(--borde);
}

};
const plantas = id => siembrasDe(id).reduce((t, s) => t + (s.cantidad || 0), 0);
const n = x => (x == null ? '—' : x.toLocaleString('es-CO'));
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const et = (tono, txt) => `<span class="etiqueta etiqueta--${tono}"><span aria-hidden="true">${{ok:'✓',aviso:'!',alerta:'✕',neutro:'·'}[tono]}</span> ${esc(txt)}</span>`;

function vistaBloques() {
  return `<h1 class="titulo">Bloques</h1>
    <p class="subtitulo">${S.bloques.length} bloques · ${S.camas.length} camas · ${S.siembras.length} registros del formato real</p>
    <div class="lista">` + S.bloques.map(b => {
      const cs = camasDe(b.id), dv = cs.filter(c => dividida(c.id)).length;
      return `<button class="tarjeta tarjeta--pulsable" onclick="ir({v:'camas',id:'${b.id}'})">
        <div class="tarjeta__fila"><span class="tarjeta__codigo">Bloque ${esc(b.codigo)}</span><span class="tarjeta__flecha">›</span></div>
        <div class="tarjeta__meta"><span>${cs.length} camas</span>${b.tiposFlor.filter(Boolean).map(t => `<span>${esc(t)}</span>`).join('')}
        ${dv ? et('neutro', dv + ' divididas') : ''}</div></button>`;
    }).join('') + `</div>`;
}

function vistaCamas(id) {
  const b = bloque(id);
  return `<button class="boton boton--tenue" onclick="ir({v:'bloques'})">‹ Bloques</button>
    <h1 class="titulo">Bloque ${esc(b.codigo)}</h1>
    <p class="subtitulo">${camasDe(id).length} camas con registro en el formato</p>
    <div class="lista lista--densa">` + camasDe(id).map(c => {
      const ss = siembrasDe(c.id);
      const aviso = ss.some(s => avisosDe(s.id).length);
      return `<button class="tarjeta tarjeta--pulsable" onclick="ir({v:'cama',id:'${c.id}'})">
        <div class="tarjeta__fila"><span class="tarjeta__codigo">Cama ${esc(c.codigo)}</span><span class="tarjeta__flecha">›</span></div>
        <div class="tarjeta__meta"><span>${esc(ss.map(s => variedad(s.variedadId).nombre).join(' + ') || 'sin siembra')}</span>
        ${plantas(c.id) ? `<span>${n(plantas(c.id))} plantas</span>` : ''}
        ${dividida(c.id) ? et('neutro', 'dividida') : ''}${aviso ? et('aviso', 'revisar') : ''}</div></button>`;
    }).join('') + `</div>`;
}

function vistaCama(id) {
  const c = cama(id), b = bloque(c.bloqueId), ss = siembrasDe(id);
  const fechas = [...new Set(ss.map(s => s.fecha))];
  return `<button class="boton boton--tenue" onclick="ir({v:'camas',id:'${b.id}'})">‹ Bloque ${esc(b.codigo)}</button>
    <h1 class="titulo">Cama ${esc(c.codigo)}</h1>
    <p class="subtitulo">Bloque ${esc(b.codigo)} · lo que dice el formato en papel</p>` +
    fechas.map(f => {
      const items = ss.filter(s => s.fecha === f);
      return `<section class="jornada"><h2 class="jornada__fecha">${esc(f)}
        ${items.length > 1 ? et('neutro', items.length + ' secciones') : ''}</h2>` +
        items.map(s => {
          const campos = [
            ['# líneas', s.lineas], ['Cantidad', s.cantidad === null ? null : n(s.cantidad)],
            ['Plantas por línea', s.razonPlantasPorLinea], ['Lote', s.lote], ['Calibre', s.calibre],
            ['Proveedor', s.proveedor], ['Contenedor', s.contenedor],
            ['OBSE', s.obse ? s.obse + ' (significado desconocido)' : null],
            ['Observaciones', s.observaciones],
          ].filter(([, v]) => v !== null && v !== undefined && v !== '');
          return `<div class="seccion">
            <div class="seccion__cabeza"><span class="seccion__variedad">${esc(variedad(s.variedadId).nombre)}</span>
            <span class="seccion__hoja">${esc(s.hojaOrigen)} · fila ${s.filaOrigen}</span></div>
            <dl class="datos">${campos.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
            ${avisosDe(s.id).map(a => `<p class="aviso">${et('aviso', 'revisar')} ${esc(a.detalle)}</p>`).join('')}
          </div>`;
        }).join('') + `</section>`;
    }).join('') +
    `<p class="nota">La captura entra en el D2 del plan. Hoy esta pantalla solo muestra lo que el formato de papel ya dice, para poder contrastarlo con el cliente.</p>`;
}

function vistaDatos() {
  const rev = S.anomalias.filter(a => a.severidad === 'revisar');
  const inf = S.anomalias.filter(a => a.severidad === 'informativo');
  const dv = S.camas.filter(c => dividida(c.id)).length;
  const cifra = (x, t) => `<div class="cifra"><span class="cifra__n">${x}</span><span class="cifra__etiqueta">${esc(t)}</span></div>`;
  return `<h1 class="titulo">Datos de la semilla</h1><p class="subtitulo">${esc(S.advertencia)}</p>
    <div class="cifras">${cifra(S.bloques.length, 'bloques')}${cifra(S.camas.length, 'camas')}
    ${cifra(S.variedades.length, 'variedades')}${cifra(S.siembras.length, 'registros')}
    ${cifra(dv, `camas divididas (${Math.round(dv / S.camas.length * 100)}%)`)}${cifra(rev.length, 'filas a revisar')}</div>
    <h2 class="seccion__titulo">Lo que la regla ya encuentra en el histórico real</h2>
    ${rev.map(a => `<p class="aviso">${et('aviso', a.tipo)} ${esc(a.detalle)}${a.hoja ? `<span class="aviso__origen"> — ${esc(a.hoja)}, fila ${a.fila}</span>` : ''}</p>`).join('')}
    <h2 class="seccion__titulo">Camas divididas (confirma DEC-14)</h2>
    ${inf.map(a => `<p class="aviso aviso--neutro">${et('neutro', a.tipo)} ${esc(a.detalle)}</p>`).join('')}
    <h2 class="seccion__titulo">Preguntas abiertas que dejó el archivo</h2>
    ${S.avisos.map(a => `<p class="aviso aviso--neutro">${esc(a)}</p>`).join('')}
    <h2 class="seccion__titulo">Plantas por línea derivadas</h2>
    <table class="tabla"><thead><tr><th>Variedad</th><th>Tipo</th><th>P/línea</th><th>Confianza</th></tr></thead><tbody>
    ${S.variedades.map(v => `<tr><td>${esc(v.nombre)}</td><td>${esc(v.tipoFlor || '—')}</td><td>${v.plantasPorLinea ?? '—'}</td>
    <td>${et(v.confianza === 'alta' ? 'ok' : v.confianza === 'en-disputa' ? 'alerta' : 'aviso', v.confianza)}</td></tr>`).join('')}
    </tbody></table>
    <p class="nota">Semilla generada el ${esc(S.generado)} desde ${esc(S.origen)}.</p>`;
}

function ir(estado) {
  const c = document.getElementById('contenido');
  c.innerHTML = estado.v === 'camas' ? vistaCamas(estado.id)
    : estado.v === 'cama' ? vistaCama(estado.id)
    : estado.v === 'datos' ? vistaDatos()
    : vistaBloques();
  window.scrollTo(0, 0);
}

document.getElementById('sub').textContent = 'Captura · ' + (S.fincas[0] ? S.fincas[0].nombre : '—');
document.getElementById('pie').textContent = S.version + ' · ' + S.origen;
ir({v: 'bloques'});
</script>

</body>
</html>
